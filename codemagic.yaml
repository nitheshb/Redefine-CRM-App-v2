workflows:
  # ──────────────────────────────────────────────
  # Redefine CRM — iOS App Store
  # ──────────────────────────────────────────────
  ios-workflow:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect:  codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.crmcustomers.app
      flutter: stable
      xcode: 16.2
      cocoapods: default
    scripts:
      - name: Set up local.properties
        script: echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"

      - name: Get Flutter packages
        script: flutter packages pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install

      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.crmcustomers.app" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build IPA
        script: |
          # Step 1: Generate Xcode project files without building
          flutter build ios --config-only --release
          
          # Step 2: Re-run pod install to ensure everything is in sync
          cd "$CM_BUILD_DIR/ios"
          pod install
          
          # Step 3: Strip unsupported -G flag from all pod xcconfig files
          find "$CM_BUILD_DIR/ios/Pods" -name "*.xcconfig" -exec sed -i '' 's/ -G//g' {} +
          find "$CM_BUILD_DIR/ios/Pods" -name "*.xcconfig" -exec sed -i '' 's/-G //g' {} +
          
          # Step 4: Archive with xcodebuild
          xcodebuild -workspace "$CM_BUILD_DIR/ios/Runner.xcworkspace" \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -archivePath "$CM_BUILD_DIR/build/ios/Runner.xcarchive" \
            archive | xcpretty
          
          # Step 5: Export IPA
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/ios/Runner.xcarchive" \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" | xcpretty

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - rakeshduvva49@gmail.com
        notify:
          success: true
          failure: true

  # ──────────────────────────────────────────────
  # Redefine CRM — Android
  # ──────────────────────────────────────────────
  android-workflow:
    name: Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - android_signing
      flutter: stable
      java: 17
    scripts:
      - name: Set up local.properties
        script: echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"

      - name: Get Flutter packages
        script: flutter pub get

      - name: Build AAB
        script: flutter build appbundle --release

    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt

    publishing:
      email:
        recipients:
          - rakeshduvva49@gmail.com
        notify:
          success: true
          failure: true
